name: CI Build Verification

on:
  push:
    branches: [ main, 3.1-maint, maint-3.5, 3.2-dev, dev-3.3.0, dev-3.4.0, dev-3.6.0, upgrades, 'feature/**' ]
  pull_request:
    branches: [ main, 3.1-maint, maint-3.5, 3.2-dev, dev-3.3.0, dev-3.4.0, dev-3.6.0 ]

jobs:
  build-sender:
    name: Build Sender (${{ matrix.os }} - ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Tools
        run: |
          brew install cmake jq xcodegen

      - name: Check Localizations
        run: |
          ./TargetBridge-Shared/scripts/check_localizations.sh

      - name: Build Sender App
        run: |
          cd TargetBridge-Sender
          ./scripts/build_targetbridge_sender_app.sh
          file ../build/TargetBridge.app/Contents/MacOS/TargetBridge | grep -q "${{ matrix.arch }}"
          file ../build/TargetBridge.app/Contents/PlugIns/TargetBridgeAudio.driver/Contents/MacOS/TargetBridgeAudio | grep -q "${{ matrix.arch }}"

      - name: Zip Sender App
        run: |
          cd build
          zip -ry TargetBridge-${{ matrix.arch }}.app.zip TargetBridge.app

      - name: Upload Sender App
        uses: actions/upload-artifact@v7
        with:
          name: TargetBridge-${{ matrix.arch }}
          path: build/TargetBridge-${{ matrix.arch }}.app.zip
          retention-days: 7

      - name: Run Sender Unit Tests
        run: |
          cd TargetBridge-Sender
          xcodebuild test -project TargetBridge.xcodeproj -scheme TBDisplaySender -destination 'platform=macOS' -derivedDataPath .build/DerivedData

      - name: Check Integrated Video Queue Guards
        run: ruby TargetBridge-Sender/scripts/test_video_queue_budget.rb

      - name: Check Sender Permission Probe
        run: ruby TargetBridge-Sender/scripts/test_permission_status.rb sender build/TargetBridge.app/Contents/MacOS/TargetBridge

  build-receiver:
    name: Build Receiver (${{ matrix.os }} - ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          brew install ffmpeg jq sdl2 sdl3 dylibbundler

      - name: Check Localizations
        run: |
          ./TargetBridge-Shared/scripts/check_localizations.sh

      - name: Run Receiver Parser Tests
        run: |
          cd TargetBridge-Receiver/TBReceiverC
          make test

      - name: Build Receiver App
        run: |
          cd TargetBridge-Receiver
          ./scripts/build_tbreceiver_c_app.sh

      - name: Zip Receiver App
        run: |
          cd build
          zip -ry TargetBridge-Receiver-${{ matrix.arch }}.app.zip "TargetBridge Receiver.app"

      - name: Upload Receiver App
        uses: actions/upload-artifact@v7
        with:
          name: TargetBridge-Receiver-${{ matrix.arch }}
          path: build/TargetBridge-Receiver-${{ matrix.arch }}.app.zip
          retention-days: 7

      - name: Check Receiver Permission Probe
        run: ruby TargetBridge-Sender/scripts/test_permission_status.rb receiver 'build/TargetBridge Receiver.app/Contents/MacOS/TargetBridgeReceiver'
